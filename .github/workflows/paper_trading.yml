name: Paper trading

# Scheduled jobs driving live/decide.py, live/execute.py, live/mark.py, live/report.py
# (Phase 5, semis_paper_trading_brief.md). Every cron time below is UTC and only
# approximates US market hours -- it is not DST-aware, the same kind of documented
# approximation as everything else in this project that can't be pinned exactly (see
# CLAUDE.md's "Gotchas"). The real gate is in code, not in these cron expressions:
# execution/pretrade.py::check_pretrade refuses outside the configured execution window
# and closed-market hours regardless of exactly when this workflow happens to fire, and a
# non-rebalance day's `decide` is a fast no-op via its own cadence guard
# (live/decide.py::run_decide) -- cron does not need to land on exactly the right day.
#
# **External triggering (added 2026-09-27).** GitHub delivers this repo's `schedule`
# events 4-5 hours late -- every morning job in both workflows landed in a burst around
# 17:10-18:20 UTC during Stage 1, whatever its cron said (tasks/todo.md). The reliable
# fix is outside GitHub: an external scheduler calls the `workflow_dispatch` API at the
# exact minute with `{"ref": "main", "inputs": {"job": "<job>"}}`, and each job below
# runs only for its own name. The crons stay as a fallback -- every job here is already
# idempotent or safely repeatable, so a late cron firing after the external one is a
# no-op or a harmless re-check. A manual "Run workflow" click now runs exactly the one
# job picked, not every job at once (which is what the old bare `workflow_dispatch`
# condition on each job did). Setup steps: docs/external_scheduler.md.
#
# Trading stays off by default even once this runs on a schedule: config/paper.yaml ships
# with paper.registered_accounts empty and every sleeve's trading_enabled false. Both must
# be deliberately edited before `paper execute` can do anything but decline at pretrade.
#
# Each job below is entirely self-contained (its own checkout, its own steps in
# sequence) rather than chained with `needs:` across jobs -- the three schedules below are
# mutually exclusive (each workflow run matches exactly one `github.event.schedule`
# value), so a `needs:` dependency on a job gated by a *different* schedule would make the
# dependent job perpetually skipped except on the one trigger where both happened to
# match. Ordering within a single rebalance (fetch -> decide -> execute) is instead
# guaranteed by running as sequential steps of the same job, not separate jobs. Decide and
# execute are one step together with the ledger commit (not two) so a git push race
# between matrix entries can retry both, not just re-attempt the push -- see that step's
# own comment.

"on":
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (external scheduler or manual run)"
        required: true
        type: choice
        options:
          - decide-and-execute
          - mark
          - report
  schedule:
    # decide + execute: every weekday, ~9-10am ET depending on DST.
    - cron: "0 14 * * 1-5"
    # mark: every 30 minutes through the US trading session, ~10am-4pm ET depending on DST.
    - cron: "*/30 14-20 * * 1-5"
    # report: once daily after the close, ~5:30pm ET depending on DST.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  decide-and-execute:
    if: github.event.schedule == '0 14 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.job == 'decide-and-execute')
    runs-on: ubuntu-latest
    concurrency:
      # Shared with the mark job below -- both write ledger/paper.sqlite3 and commit it,
      # and this cron and the mark cron both match minute :00 of every hour they overlap,
      # so without a shared group two workflow runs could race on the same git push.
      group: paper-trading-ledger-write
      cancel-in-progress: false
    strategy:
      matrix:
        sleeve: [s0, s3, vol_twin_shadow, sector_shadow]
      # Matrix entries run in parallel by default, which would have the same commit-race
      # problem the concurrency group above solves across jobs -- serialize within the job
      # too, since every entry here writes the same ledger file.
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Refresh cached prices
        run: uv run semimc fetch --config config/paper.yaml
      - name: Decide, execute, and commit the ledger
        # Decide (all sleeves, including shadow-only ones -- for the eventual T3/T4
        # comparison) and Execute (s0/s3 only -- the only sleeves with a paper.sleeves
        # entry) are one step together with the commit, retried as a unit on a git push
        # race: this job's matrix and the mark job below share one ledger file and one
        # concurrency group specifically to prevent that race, but a real workflow_dispatch
        # run still showed two matrix entries' pushes interleaving (Phase 8, confirmed
        # against GitHub's actual infrastructure, not assumed). `ledger/paper.sqlite3` is
        # binary, so a plain `git pull --rebase` can't 3-way-merge two independent row
        # insertions into it. Since 2026-10-08 a rejected push is first rebased
        # (`.github/scripts/push_ledger.sh`): the run that beat it is usually the intraday
        # workflow, writing other files, and re-running there only repeated work already
        # done. Only when the rebase conflicts -- another sleeve changed paper.sqlite3 --
        # does this re-fetch the latest ledger and re-run decide/execute against it,
        # reconciling at the application level (both are already idempotent: decide's own
        # cadence-skip, execute's same-decision no-op).
        # A genuine command failure (e.g. missing credentials) still fails the job, so
        # Phase 7's "an incident fails the job" behavior is unchanged -- but only after
        # committing whatever the command already wrote (an execute that submitted some
        # orders before failing). Plain `set -e` stopped before the commit and lost those
        # rows, which is how two intraday cycles lost theirs on 2026-10-01. A failed decide
        # skips execute. Only the push race is retried.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            status=0
            echo "::group::decide"
            uv run semimc paper decide --sleeve ${{ matrix.sleeve }} --config config/paper.yaml || status=$?
            echo "::endgroup::"
            if [ "$status" = 0 ] && { [ "${{ matrix.sleeve }}" = "s0" ] || [ "${{ matrix.sleeve }}" = "s3" ]; }; then
              echo "::group::execute"
              uv run semimc paper execute --sleeve ${{ matrix.sleeve }} --config config/paper.yaml || status=$?
              echo "::endgroup::"
            fi
            git add ledger/paper.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit "$status"
            fi
            # The session date, as in cli.py::_trading_day: the day rolls over at 04:00 New York.
            git commit -m "paper decide/execute: ${{ matrix.sleeve }} $(TZ=America/New_York date -d '4 hours ago' +%F)"
            push_status=0
            bash .github/scripts/push_ledger.sh || push_status=$?
            if [ "$push_status" = 0 ]; then
              exit "$status"
            fi
            if [ "$push_status" != 3 ]; then
              exit 1
            fi
            echo "ledger/paper.sqlite3 changed upstream (attempt $attempt/3) -- re-running against it"
          done
          echo "ledger/paper.sqlite3 still changing upstream after 3 attempts"
          exit 1

  mark:
    if: github.event.schedule == '*/30 14-20 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.job == 'mark')
    runs-on: ubuntu-latest
    concurrency:
      group: paper-trading-ledger-write
      cancel-in-progress: false
    strategy:
      matrix:
        sleeve: [s0, s3]
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Poll fills, reconcile, and commit the ledger
        # A rejected push is rebased first, and mark re-runs only when another sleeve
        # changed paper.sqlite3 -- see the decide-and-execute job's identical comment.
        # mark is already safe to re-run: each attempt re-polls fresh state from the broker
        # rather than assuming anything about the previous attempt's local ledger state.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A failing mark still commits what it wrote, then fails the job (see above).
            status=0
            uv run semimc paper mark --sleeve ${{ matrix.sleeve }} --config config/paper.yaml || status=$?
            git add ledger/paper.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit "$status"
            fi
            git commit -m "paper mark: ${{ matrix.sleeve }} $(TZ=America/New_York date -d '4 hours ago' +%F)"
            push_status=0
            bash .github/scripts/push_ledger.sh || push_status=$?
            if [ "$push_status" = 0 ]; then
              exit "$status"
            fi
            if [ "$push_status" != 3 ]; then
              exit 1
            fi
            echo "ledger/paper.sqlite3 changed upstream (attempt $attempt/3) -- re-running against it"
          done
          echo "ledger/paper.sqlite3 still changing upstream after 3 attempts"
          exit 1

  report:
    if: github.event.schedule == '30 21 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.job == 'report')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sleeve: [s0, s3]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Read-only -- no broker, no secrets, no ledger write, no commit needed.
      - run: uv run semimc paper report --sleeve ${{ matrix.sleeve }} --config config/paper.yaml
