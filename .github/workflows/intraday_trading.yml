      - run: uv sync --locked
      - name: Surface the week's numbers and commit the ledger and report
        # No claude CLI install and no ALPACA_S4_* secrets here -- weekly-review reads
        # only the ledger (no broker, no market data, no model call; confirmed against
        # the brief -- see this file's header comment). It never touches PLAYBOOK.md or
