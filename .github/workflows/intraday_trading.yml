name: Intraday trading (S4)

# Scheduled jobs driving intraday/jobs.py (Phase 5, BRIEF_INTRADAY.md) via `semimc
# intraday ...`. Mirrors .github/workflows/paper_trading.yml's own shape exactly -- see
# that file's header comment for the reasoning this one shares: cron times below are UTC
# and only approximate the brief's Central-time schedule (not DST-aware, same documented
# approximation CLAUDE.md's "Gotchas" already accepts elsewhere); the real gate is in
# code, not in these cron expressions -- intraday/pretrade.py::check_intraday_pretrade
# refuses outside trading_enabled/registered_account/market-open regardless of exactly
# when this workflow fires.
#
# Trading stays off by default even on a schedule: config/paper.yaml ships with
# intraday.trading_enabled false and no registered_account. Both must be deliberately
# edited before any of these jobs can do anything but decline at pretrade.
#
# Nine jobs (preflight/research/preopen/monitor/open-batch/cycle/carry/eod-review/
# weekly-review) -- the five Phase 5 builds, monitor's own frequent, model-free cron
# (BRIEF_INTRADAY.md's "minute monitor", adapted to this project's cron architecture --
# see the Phase 5 plan), Phase 6's `research`, Phase 9b's `eod-review`, and Phase 10's
# `weekly-review`. Eight of the nine share one concurrency group: unlike
# paper_trading.yml's two ledger-writing jobs, all nine touch the same
# ledger/intraday.sqlite3, so eight need to serialize their git commits, not just a pair
# of them. `monitor` is the deliberate exception -- see its own job comment below.
#
# **`monitor` self-loops instead of relying on GitHub's cron for its 5-minute cadence.**
# Found 2026-09-24/25: GitHub's own `schedule` event delivery for this repo is far less
# reliable than the `*/5` cron below promises -- real telemetry (`monitor_checks` table)
# showed gaps of ~165-172 minutes between checks on both days, with nothing (monitor,
# cycle, or open-batch) firing in between, against a 5-minute configured cadence. Since
# `FakeBroker` never auto-triggers a resting stop, a real invalidated shadow position
# could sit unprotected for the entire gap. Rather than depend on ~80 separate
# GitHub-scheduled firings a day all landing on time, one successful firing now keeps
# checking and committing on its own every 5 minutes for up to ~5.5 hours (comfortably
# under GitHub-hosted runners' hard 6-hour job cap) or until the trading day's own close,
# whichever comes first -- see the job's own step comment for the loop itself. The `*/5`
# cron trigger is unchanged and now pure redundancy: an overlapping second loop is
# harmless (each iteration's own fetch/reset/push-retry already handles concurrent
# writers safely, the same pattern every other job here uses), which is exactly why
# `monitor` was pulled out of the shared concurrency group -- a 5.5-hour-long loop must
# not block `cycle`/`carry` from running for the rest of the session.
#
# `weekly-review` never accepts, rejects, or retires a playbook proposal -- confirmed
# directly against the brief before building it: the schedule table names no agent for
# `weekly_review`, and "Ask first: Accepting a playbook proposal"/"accepted or rejected
# by me... not automatically" both rule out a cron job deciding anything. It only writes
# `reports/.../weekly_review.md`; the `intraday playbook accept/reject/retire` commands
# that actually change `PLAYBOOK.md` are deliberately not wired into any workflow here --
# they stay a human running the CLI locally (or via `workflow_dispatch` on this same repo,
# outside this file), whenever the user actually does their weekly review.
#
# `eod-review` also commits `reports/` (the day's `eod.md`) and, on a day with a
# proposal, `proposals/` -- both new, untracked directories the first time either exists,
# hence the `[ -d ... ] && git add ... || true` guard (a bare `git add nonexistent-dir`
# would fail the pathspec match and trip `set -e`). `weekly-review` uses the same guard
# for `reports/` alone -- it never writes `proposals/`.
#
# `research` also runs `semimc fetch` before its own command, mirroring
# paper_trading.yml's `decide` job -- it reads the shared price cache (OHLC for a
# realized-vol snapshot, the earnings calendar) and runs before that job's own 14:00 UTC
# fetch would otherwise refresh it for the day.
#
# `cycle`/`monitor` pass a per-invocation `--cycle` label derived from the current UTC
# time (not a fixed literal) -- intraday_client_order_id's idempotency key includes this
# label, so two different 20-minute (or 5-minute) runs on the same day must get distinct
# labels, or the second run's orders would look like duplicate resubmissions of the
# first's and never actually submit.
#
# `open-batch`/`cycle`/`carry` each also run T6's placebo agent (Phase 7,
# `intraday/placebo.py`) right after the real command, committing its own shadow ledger
# (ledger/intraday_shadow.sqlite3) in the same commit -- no new cron entries or jobs:
# the placebo shares those three jobs' exact cadence already, needs no LLM call and no
# real broker, and folding it in avoids doubling the job/concurrency-group count for a
# control group that costs nothing extra to run alongside the real one.
#
# `research`/`open-batch`/`cycle`/`eod-review` (the jobs that actually call the model,
# i.e. the ones with ANTHROPIC_API_KEY in their env below) install the `claude` CLI itself
# via
# Anthropic's own native installer (code.claude.com/docs/en/setup's "Recommended" tab) --
# a bare `ubuntu-latest` runner has no more claim to it than the S4 Alpaca/Anthropic
# secrets did before those were added, and this went undiscovered until the first real
# run actually tried to spawn `claude` as a subprocess (`intraday/llm.py`). The installer
# has zero dependencies (unlike the alternative npm package, which needs Node.js 22+) and
# places the binary at `~/.local/bin/claude`, so each install step also appends that to
# `$GITHUB_PATH` for the rest of the job (that append only affects later steps, which is
# why the install step's own final line calls the binary by its full path -- `$GITHUB_PATH`
# isn't live yet within the script that just wrote it) and prints `claude --version`, so a
# broken install shows up immediately in this step's own log instead of surfacing later as
# an opaque subprocess failure inside `intraday/llm.py` -- this exact class of problem is
# what went undiscovered until the first real run. `carry` needs no such step -- it never
# calls `invoke_role` (run_carry/run_placebo_carry are deterministic, reused close-out
# logic). Also worth knowing: `config.intraday.trading_enabled` being `False` means
# `research`/`cycle`/`open-batch`'s own pretrade check declines before ever reaching
# `invoke_role` regardless of this install step -- so this version print, not a full
# `research`/`cycle` run, is what actually verifies the CLI itself works pre-go-live.

"on":
  workflow_dispatch: {}
  schedule:
    # preflight: ~06:45 Central.
    - cron: "45 11 * * 1-5"
    # research: ~07:30 Central.
    - cron: "30 12 * * 1-5"
    # preopen: ~08:15 Central.
    - cron: "15 13 * * 1-5"
    # open-batch: ~08:30 Central.
    - cron: "30 13 * * 1-5"
    # monitor: every 5 minutes, ~08:35-15:00 Central -- no LLM call, cheap to run often.
    - cron: "*/5 13-20 * * 1-5"
    # cycle: every 20 minutes, ~08:35-14:50 Central.
    - cron: "*/20 13-19 * * 1-5"
    # carry: ~14:45 Central.
    - cron: "45 19 * * 1-5"
    # eod-review: ~15:15 Central.
    - cron: "15 20 * * 1-5"
    # weekly-review: Friday ~15:45 Central.
    - cron: "45 20 * * 5"

permissions:
  contents: write

jobs:
  preflight:
    if: github.event.schedule == '45 11 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Preflight and commit the ledger
        # A failed preflight is a canary, not a blocker (intraday/jobs.py::run_preflight's
        # own docstring) -- `intraday preflight`'s CLI command exits 1 on a genuine
        # problem, on purpose, so GitHub's own failure email fires here specifically. A
        # routine, by-design decline exits 0 and is only printed as a "(routine)" note:
        # "market is closed" always is at preflight's own pre-market schedule, and every
        # other pretrade finding (kill switch, account mismatch/status) is routine too
        # while intraday.trading_enabled is still False, since none of it can be "wrong"
        # before S4 actually launches. Once trading_enabled flips True, those same
        # findings become real failures again.
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc intraday preflight --config config/paper.yaml
            git add ledger/intraday.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday preflight: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  research:
    if: github.event.schedule == '30 12 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - name: Research and commit the ledger
        # semimc fetch first -- research reads the shared price cache (realized-vol
        # snapshot, earnings calendar) and this is the first job of the day to need it.
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc fetch --config config/paper.yaml
            uv run semimc intraday research --config config/paper.yaml
            git add ledger/intraday.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday research: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  preopen:
    if: github.event.schedule == '15 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Preopen and commit the ledger
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc intraday preopen --config config/paper.yaml
            git add ledger/intraday.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday preopen: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  monitor:
    if: github.event.schedule == '*/5 13-20 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Enforce invalidation/time-stops and commit the ledger, looping internally
        # No Anthropic call here at all -- this is the cheap, model-free check
        # (intraday/monitor.py) that can afford running every 5 minutes for hours.
        #
        # Self-loops rather than exiting after one check -- see this workflow's header
        # comment for why. At least one iteration always runs (a single `workflow_dispatch`
        # or a cron firing right at the boundary still does something); after that it keeps
        # checking every 5 minutes until either the internal 330-minute budget is spent
        # (leaving ~10 minutes of margin under the job's 340-minute timeout, itself under
        # GitHub-hosted runners' hard 360-minute job cap) or the UTC hour reaches 20
        # (roughly `carry`'s own close-out time), whichever comes first.
        #
        # A single iteration failing all 3 push/command attempts is logged and the loop
        # moves on -- another attempt follows in 5 minutes regardless. Only 3 *consecutive*
        # fully-failed iterations (~15 minutes of total failure) exits 1, so a transient
        # push race never trips GitHub's failure email but a genuine, persistent bug still
        # does.
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
        run: |
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          deadline=$(( $(date -u +%s) + 330 * 60 ))
          consecutive_failures=0
          while true; do
            iteration_ok=0
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              if ! uv run semimc intraday monitor --cycle "monitor_$(date -u +%H%M)" --config config/paper.yaml; then
                echo "monitor command failed (attempt $attempt/3)"
                continue
              fi
              git add ledger/intraday.sqlite3
              if git diff --cached --quiet; then
                echo "nothing to commit"
                iteration_ok=1
                break
              fi
              git commit -m "intraday monitor: $(date -u +%F) $(date -u +%H:%M)"
              if git push; then
                iteration_ok=1
                break
              fi
              echo "push rejected (attempt $attempt/3) -- refetching and retrying"
            done
            if [ "$iteration_ok" = 1 ]; then
              consecutive_failures=0
            else
              consecutive_failures=$((consecutive_failures + 1))
              echo "loop iteration failed all 3 attempts ($consecutive_failures consecutive failed iterations)"
              if [ "$consecutive_failures" -ge 3 ]; then
                echo "3 consecutive fully-failed iterations -- stopping so this surfaces as a real failure"
                exit 1
              fi
            fi
            if [ "$(date -u +%s)" -ge "$deadline" ] || [ "$(date -u +%H)" -ge 20 ]; then
              break
            fi
            sleep 300
          done
          echo "monitor loop finished for this invocation"

  open-batch:
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - name: Run the first Trader cycle and the placebo, then commit both ledgers
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc intraday open-batch --config config/paper.yaml
            uv run semimc intraday placebo open-batch --config config/paper.yaml
            git add ledger/intraday.sqlite3 ledger/intraday_shadow.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday open-batch: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  cycle:
    if: github.event.schedule == '*/20 13-19 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - name: Run a Trader cycle and the placebo, then commit both ledgers
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cycle_label="cycle_$(date -u +%H%M)"
            uv run semimc intraday cycle --cycle "$cycle_label" --config config/paper.yaml
            uv run semimc intraday placebo cycle --cycle "$cycle_label" --config config/paper.yaml
            git add ledger/intraday.sqlite3 ledger/intraday_shadow.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday cycle: $(date -u +%F) $(date -u +%H:%M)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  carry:
    if: github.event.schedule == '45 19 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Carry or close out the session and the placebo, then commit both ledgers
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc intraday carry --config config/paper.yaml
            uv run semimc intraday placebo carry --config config/paper.yaml
            git add ledger/intraday.sqlite3 ledger/intraday_shadow.sqlite3
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday carry: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  eod-review:
    if: github.event.schedule == '15 20 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - name: Review the day and commit the ledger, report, and any playbook proposal
        # `semimc fetch` first -- found the hard way (a real failed run, 2026-09-23):
        # `data_cache/` is gitignored ("reproducible outputs, not source"), and each job
        # in this workflow gets its own fresh, ephemeral runner. `research`'s own 07:30
        # fetch runs on a *different* VM, hours earlier, and never persists here --
        # `intraday_eod_review`'s `load_market_data(cfg, tickers=["SOXX"])` call
        # (cli.py) needs this job's own fetch, same as `research`'s job already does.
        env:
          ALPACA_S4_API_KEY: ${{ secrets.ALPACA_S4_API_KEY }}
          ALPACA_S4_SECRET_KEY: ${{ secrets.ALPACA_S4_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          git config user.name "semimc-bot"
          git config user.email "semimc-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run semimc fetch --config config/paper.yaml
            uv run semimc intraday eod-review --config config/paper.yaml
            git add ledger/intraday.sqlite3
            [ -d reports ] && git add reports/ || true
            [ -d proposals ] && git add proposals/ || true
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "intraday eod-review: $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- refetching and retrying"
          done
          echo "failed to push after 3 attempts"
          exit 1

  weekly-review:
    if: github.event.schedule == '45 20 * * 5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: intraday-trading-ledger-write
