[project]
name = "semimc"
version = "0.1.0"
description = "Monte Carlo forecasting engine for U.S.-listed semiconductor stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "arch>=6.3,<8",
    "matplotlib>=3.8,<4",
    "pyarrow>=15,<22",
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "yfinance>=0.2.40,<1",
    # yfinance scrapes earnings dates via pandas.read_html, which needs an HTML parser.
    "lxml>=5,<7",
    # Addendum section 4: robust standard errors (Driscoll-Kraay), quantile regression,
    # and Markov regime switching.
    "statsmodels>=0.14,<1",
    # Addendum section 4: ridge/lasso, date-grouped cross-validation, pinball loss.
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
semimc = "semimc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semimc"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: tests that require network access (deselected by default)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
