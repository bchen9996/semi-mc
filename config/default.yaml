# semimc default configuration (Section 3 of the brief).
# Every value here is overridable with `--set key.path=value` on any CLI command.

universe:
  # Grouped for reporting; the flat list is the union of the groups.
  # ARM excluded deliberately: complete-case alignment truncates every whole-universe
  # model's estimation window to its shortest member's history, and ARM's 2023 IPO cost
  # everyone else about 2 years of window (~5y -> ~3y). Owner decision 2026-09-16; add it
  # back with `-s universe.groups.compute_fabless=[...,ARM]` once it has more history, or
  # if ragged-panel support (per-ticker history, not a shared intersection) gets built.
  groups:
    compute_fabless: [NVDA, AMD, AVGO, QCOM, MRVL]
    foundry_idm: [TSM, INTC]
    memory: [MU]
    equipment: [ASML, AMAT, LRCX, KLAC]
    analog: [TXN, ADI]

benchmarks:
  market: SPY        # open question 1: SPY over QQQ (QQQ is ~half tech, so it would
  sector: SOXX       # absorb the sector factor). SOXX over SMH (SMH is more top-heavy).

horizons: [21, 63, 126, 252]

simulation:
  n_paths: 10000
  seed: 42
  chunk_size: 2000        # paths simulated per chunk; caps peak memory
  dtype: float32          # float32 halves path memory; float64 also supported
  trading_days_per_year: 252

fit:
  window_years: 5         # rolling fit window
  min_observations: 750   # a ticker enters only once it has this much history
  vol_estimator: realized # realized | ewma
  vol_window_days: 252    # 1-year trailing realized volatility
  ewma_lambda: 0.94       # RiskMetrics decay, used when vol_estimator = ewma

drift:
  # shrunk_historical, not capm. Chosen by backtest (gbm, 177 monthly origins 2012-2026,
  # 14 tickers): it beat capm on mean PIT, on 50% and 90% coverage, on PIT tail mass and
  # on CRPS at every horizon (Diebold-Mariano -4.5 to -7.3). risk_free was worse than
  # capm on all of them.
  #
  # READ THIS BEFORE TRUSTING IT: that choice was made on the same period the scorecard
  # reports, which is selection on the test set. Semiconductors rose sharply over this
  # window, so a policy that leans 25% on the realized mean was always going to look
  # good; in a sector downturn it will look correspondingly bad, and capm would be the
  # safer default. `shrinkage_weight` is the dial, and `capm` is one flag away.
  policy: shrunk_historical   # capm | risk_free | shrunk_historical | manual
  equity_risk_premium: 0.05
  risk_free_rate: 0.042   # used for live forecasts; backtests use the historical series
  shrinkage_weight: 0.25  # weight on the historical mean under shrunk_historical
  manual_annual_return: {}   # e.g. {NVDA: 0.12}; required under policy = manual
  beta_benchmark: market  # betas for CAPM are measured against benchmarks.market

risk:
  var_levels: [0.95, 0.99]
  loss_threshold: 0.20    # "probability of losing more than 20%"

data:
  provider: yfinance      # yfinance | csv
  cache_dir: data_cache
  csv_dir: data_csv       # used when provider = csv
  start: 2000-01-01
  max_staleness_days: 1   # refetch only when the cache is older than this
  price_field: adj_close  # adjusted prices are mandatory (Phase 1 of the brief)
  outlier_sigma: 8.0      # daily moves beyond this many robust sigmas are flagged
  max_gap_days: 5         # calendar gaps longer than this are flagged
  earnings_calendar: config/earnings_calendar.csv

backtest:
  origin_frequency: ME    # month-end forecast origins
  n_paths: 2000           # fewer paths inside backtests, as the brief allows
  start: 2012-01-01
  models: [gbm, bootstrap, garch_t]
  baseline: gbm
  coverage_levels: [0.50, 0.90]
  pit_bins: 10
  cache_fits: true
  risk_free_series: config/risk_free_3m.csv   # point-in-time 3-month T-bill
  # Block-bootstrap-over-origins replicates for the dependence-corrected Diebold-Mariano
  # and PIT-bias tests (analytics/scoring.py). Resampling whole origins, not individual
  # ticker-origin rows, keeps co-moving tickers together in each replicate instead of
  # treating them as independent, which is what the plain (uncorrected) tests do.
  n_dependence_bootstraps: 2000

models:
  bootstrap:
    block_length: auto    # auto = arch optimal_block_length on the training window
  garch_t:
    p: 1
    o: 1                  # o = 1 gives the GJR asymmetry term
    q: 1
    rescale_factor: 100.0 # optimizer stability; converted back after simulation
  earnings_jumps:
    base_model: garch_t
    min_earnings_observations: 8
    strip_from_training: true
  factor:
    idio_model: garch_t
  fhs:
    block_length: 1       # 1 = i.i.d. by-date resampling of standardized residuals
  merton:
    max_jumps_per_day: 3   # truncated Poisson mixture; mass beyond this is negligible
    exclude_earnings_days: true   # scheduled gaps stay with the earnings overlay
  har:
    horizons: [1, 21, 63, 126, 252]   # a separate direct regression is fit per horizon
    estimator: garman_klass           # garman_klass | rogers_satchell
    innovations: bootstrap            # bootstrap (resampled residuals) | normal
    exclude_earnings_variance: true
  regime:
    search_reps: 20         # random restarts; best log-likelihood wins
    switching_mean: false   # variance-only by default; drift stays exactly the policy's
    min_expected_duration_days: 15.0   # below this, refit on weekly returns instead
  blend:
    components: [gbm, garch_t]   # addendum: "equal weights are often hard to beat"
    weights: {}                  # empty = equal weight across components

# Addendum Phase 4B: point-in-time signals and the regression-based drift tilt.
signals:
  horizons: [21, 63]
  holdout_months: 24
  holdout_headline_horizon: 21   # 24mo leaves ~8 non-overlapping 63d origins -- too few to
                                  # carry a conclusion; the 63d holdout cell is still
                                  # computed and reported, flagged low_power.
  shrinkage_lambda: 0.5
  tilt_cap_annual: 0.10
  n_coefficient_bootstraps: 500
  momentum_lookback_days: 252    # 12 months
  momentum_skip_days: 21         # most recent month excluded, used separately as reversal
  relative_strength_lookback_days: 126   # ~6 months, vs. the sector benchmark
  earnings_drift_active_days: 60
  # TSMC monthly revenue and SIA global sales both need scraping (an ask-first boundary
  # in CLAUDE.md) and neither publishes a free, key-free API. FRED's IPG3344S --
  # semiconductor and related electronic component manufacturing industrial production --
  # needs neither, at the cost of being a revised-only series with no published vintage,
  # so its release date is approximated by a conservative publication lag. Flagged as a
  # limitation in MODEL_NOTES, not hidden.
  industry_series_id: IPG3344S
  industry_publication_lag_days: 45
  customer_tickers: [AAPL, MSFT, GOOGL, AMZN, META, TSLA, DELL, HPQ, CSCO]
  supply_chain_links: data/external/supply_chain_links.csv
  external_dir: data/external
  driscoll_kraay_lag_per_horizon: 1.0   # maxlags = ceil(this * horizon / 21)
  min_regression_observations: 60
  cv_n_folds: 5
  cv_gap_periods: 1   # fold gap, in sampling periods, at least the forecast horizon needs
  origin_frequency: ME   # pandas offset alias; a shorter/higher-frequency search is --set-only
  ridge_lasso_alphas: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]   # selected by pre-holdout CV
  quantile_levels: [0.05, 0.25, 0.5, 0.75, 0.95]

portfolio:
  weights: {}             # empty = equal weight across the requested tickers
  rebalance: none         # none | monthly | quarterly

# `simulate --implied-vol`. Live-only -- fetches today's option chain, so it has no
# backtest counterpart and cannot be validated against history. See data/options.py.
options:
  moneyness_band: 0.10        # strikes within +/- 10% of spot
  max_expiries: 6              # nearest listed expiries fetched and considered
  min_quotes_per_expiry: 2     # below this, an expiry contributes no vol (NaN, not a guess)
  dividend_yield: 0.0          # continuous yield in Black-Scholes; TXN/ADI pay real dividends

scenarios:
  sector_shock_25:
    kind: sector_shock
    shock: -0.25          # instantaneous sector move, propagated through betas
  vol_spike_2x_21d:
    kind: vol_multiplier
    multiplier: 2.0
    days: 21
  export_control_china:
    kind: custom_shock
    shocks: {NVDA: -0.15, AMD: -0.12, AMAT: -0.18, LRCX: -0.18, KLAC: -0.15, ASML: -0.10}
  replay_covid_2020:
    kind: historical_replay
    start: 2020-02-19
    end: 2020-03-23
  replay_2022_derating:
    kind: historical_replay
    start: 2022-01-03
    end: 2022-10-14

reporting:
  fan_percentiles: [5, 25, 50, 75, 95]
  figure_dpi: 120
  runs_dir: runs

# semis_paper_trading_brief.md. Scoped for now to S0 (equal-weight control) and S3
# (vol-targeted control) -- S1/S2 have no code path yet, since the addendum's Phase 4B
# holdout came back null (research_log.md, 2026-09-16) and the brief's own rule is that
# paper trading can't rescue a signal that failed its holdout.
paper:
  sleeves:
    s0: {trading_enabled: false, rebalance_frequency: ME}   # every sleeve starts disabled, always, on purpose
    s3: {trading_enabled: false, rebalance_frequency: ME}
  execution:
    start_time: "10:00"
    cutoff_time: "15:30"
    timezone: America/New_York
    collar_bps: 20            # marketable limit orders collared this far beyond the quote
    reprice_interval_minutes: 15
  reconciliation:
    position_tolerance_shares: 0.000001
    cash_tolerance_usd: 1.0
  evaluation:
    n_bootstrap: 2000
    block_length_days: 21
  minimum_trade_pct: 0.005    # 0.5% of sleeve equity
  s3_target_vol: 0.25         # 25% annualized, no leverage
  s3_max_leverage: 1.0
  sector_tilt_strength: 0.15  # T4 shadow overlay: max gross-exposure tilt, capped by s3_max_leverage
  review_months: [3, 6, 12]
  registered_accounts: []     # paper-only guard: empty until an account is deliberately added
  kill_switch_path: runs/paper/KILL_SWITCH   # its mere existence halts all trading
  ledger_path: ledger/paper.sqlite3   # git-tracked, not under runs/ -- must survive a stateless CI runner

# BRIEF_INTRADAY.md. S4: the LLM-driven intraday agent sleeve. No code path yet beyond
# Phase 0's plumbing (config, ledger, credential routing, budget enforcement) -- see
# tasks/todo.md's S4 section. Its own sleeve, its own Alpaca paper account, never s0/s3's.
intraday:
  trading_enabled: false
  registered_account: null
  shadow_mode: true
  shadow_starting_equity: 100000.0
  budget:
    max_cost_usd_per_call: 1.0
    max_cost_usd_per_day: 10.0   # placeholder -- recalibrate from real shadow-mode logging
  risk:
    new_positions_per_day: 6
    round_trips_per_symbol_per_day: 2
    daily_turnover_pct: 1.50
    risk_per_trade_pct: 0.0075
    single_name_cap_pct: 0.15
    gross_cap_pct: 1.50
    net_long_cap_pct: 1.00
    daily_loss_soft_pct: 0.02
    daily_loss_hard_pct: 0.03
    cooldown_minutes_after_stopout: 30
    overnight_gross_cap_pct: 1.00
    min_edge_multiple: 2.0
    equity_cost_bps_per_side: 8.0
    entry_tranches: 2
    max_spread_bps: 50.0
    max_quote_age_seconds: 30.0
  schedule:
    timezone: America/Chicago
    cycle_interval_minutes: 20
  options:
    enabled: false   # both gates unresolved -- see docs/alpaca_notes.md
  models:
    researcher: sonnet
    trader: haiku      # cheapest model -- ~20 calls/day, vs. 2/day for researcher/reviewer
    reviewer: sonnet
    max_turns: 6
    timeout_seconds: 300
  research:
    news_lookback_hours: 16.0
    preopen_lookback_hours: 2.0
    earnings_lookahead_days: 5
    max_headlines_per_symbol: 5
  placebo:
    stop_distance_pct: 0.02
    time_stop_minutes: 120
    starting_equity: 100000.0
  playbook:
    evidence_min_trading_days: 10
    evidence_min_trades: 20
    review_after_days: 30   # placeholder -- brief gives no number, see config.py's caveat
  kill_switch_path: runs/intraday/KILL_SWITCH
  ledger_path: ledger/intraday.sqlite3
  shadow_ledger_path: ledger/intraday_shadow.sqlite3
  reports_dir: reports
  playbook_path: PLAYBOOK.md
  proposals_dir: proposals
